name: pymind_academy
description: PyMind Academy — Offline-first Python & AI learning app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # Local storage
  shared_preferences: ^2.2.3

  # Markdown rendering
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  # Fonts & UI
  google_fonts: ^6.2.1

  # Utilities
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/lessons/01_python_basics/
    - assets/lessons/02_control_flow/
    - assets/lessons/03_functions/
    - assets/lessons/04_data_structures/
    - assets/lessons/05_oop/
    - assets/lessons/06_file_handling/
    - assets/lessons/07_apis/
    - assets/lessons/08_automation/
    - assets/lessons/09_numpy_pandas_ml/
    - assets/lessons/10_ai_agentic/
    - assets/quizzes/
    - assets/projects/
    - assets/roadmap/
    - assets/quotes/
    - assets/images/
